<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff2bd6" />
    <title>Pulse Perch — offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07060c;
        --fg: #f2eef8;
        --muted: #9a90a8;
        --accent: #ff2bd6;
        --border: #2a2436;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, #1a0f24 0%, var(--bg) 55%);
        color: var(--fg);
      }
      main {
        max-width: 28rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem 1.35rem;
        background: rgba(12, 10, 18, 0.85);
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.35rem;
        color: var(--accent);
      }
      p {
        margin: 0.45rem 0;
        line-height: 1.45;
        color: var(--muted);
      }
      strong {
        color: var(--fg);
      }
      a {
        color: var(--accent);
      }
      button {
        margin-top: 0.85rem;
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        border-radius: 8px;
        padding: 0.45rem 0.85rem;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pulse Perch</h1>
      <p>
        You’re <strong>offline</strong>. The app shell can still open, but
        <strong>Suite, RPC, and WalletConnect need a network</strong>.
      </p>
      <p>
        Keys stay on your Trezor — nothing here signs without Suite when you’re
        back online.
      </p>
      <button type="button" onclick="location.href='/'">Try again</button>
    </main>
  </body>
</html>
